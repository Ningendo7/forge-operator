apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: forge-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: forge-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: forge-operator
  # 2 by default: the webhook server runs in this same pod, with
  # failurePolicy: Fail on the validating webhook -- a single replica means
  # any create/update to an Application (including removing a finalizer to
  # un-stick a deletion) is flatly rejected whenever that one pod is down.
  # Leader election only gates the reconcile loop, not the webhook server
  # (every replica serves admission requests independently), so this is
  # safe to raise without risking duplicate reconciliation.
  replicas: 2
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: forge-operator
    spec:
      # podAntiAffinity: soft (preferred, not required) spreading of
      # replicas across nodes -- soft, not hard, so a single-node dev/test
      # cluster (e.g. kind) doesn't leave the second replica stuck Pending
      # forever; it just won't get the node-failure protection there.
      #
      # TODO(user): Uncomment the nodeAffinity block below to also constrain
      # which platforms this schedules onto, according to the platforms
      # which are supported by your solution. It is considered best
      # practice to support multiple architectures. You can build your
      # manager image using the makefile target docker-buildx.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: control-plane
                      operator: In
                      values:
                        - controller-manager
                topologyKey: kubernetes.io/hostname
        # nodeAffinity:
        #   requiredDuringSchedulingIgnoredDuringExecution:
        #     nodeSelectorTerms:
        #       - matchExpressions:
        #         - key: kubernetes.io/arch
        #           operator: In
        #           values:
        #             - amd64
        #             - arm64
        #             - ppc64le
        #             - s390x
        #         - key: kubernetes.io/os
        #           operator: In
        #           values:
        #             - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
