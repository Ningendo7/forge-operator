## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Extra environment variables for the manager container. Notably:
  ## - OIDC_PROVIDER_ARN / OIDC_PROVIDER_URL: required for AWS IRSA (see
  ##   the Authentication Flows section in the README) — without these,
  ##   AWS storage reconciliation cannot construct the IRSA trust policy.
  ## - DEFAULT_AKAMAI_REGION: fallback region for Akamai/Linode storage
  ##   when an Application doesn't set spec.storage.region itself. Should
  ##   match wherever your Akamai/Linode infrastructure actually runs —
  ##   there's no built-in default, since one baked into the chart would
  ##   only ever be correct for a specific deployment.
  ##
  # env:
  #   - name: OIDC_PROVIDER_ARN
  #     value: "arn:aws:iam::123456789012:role/example"
  #   - name: OIDC_PROVIDER_URL
  #     value: "oidc.eks.us-east-1.amazonaws.com/id/EXAMPLE"
  #   - name: DEFAULT_AKAMAI_REGION
  #     value: "us-iad"

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

  reader:
    ## The chart already creates a metrics-reader ClusterRole (nonResourceURLs
    ## /metrics, verb get), but binds it to nobody by default -- something
    ## still has to be granted that role before it can actually authenticate
    ## to scrape /metrics when metrics.secure is true. List the ServiceAccount(s)
    ## that need to read this operator's metrics here, e.g. the Prometheus
    ## ServiceAccount from a kube-prometheus-stack install:
    ##   serviceAccountBindings:
    ##     - name: kube-prometheus-stack-prometheus
    ##       namespace: monitoring
    ## Only takes effect when metrics.enabled and metrics.secure are both true
    ## (same gate as the metrics-reader ClusterRole itself).
    ##
    serviceAccountBindings: []

## Webhook server configuration (Application defaulting + validation).
## Requires cert-manager (certManager.enabled below) for TLS, since
## MutatingWebhookConfiguration/ValidatingWebhookConfiguration use
## failurePolicy: Fail — without a trusted cert, every Application
## create/update would be rejected.
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## Cert-manager integration for TLS certificates.
## Required for the webhook server above and for the metrics endpoint's
## certificate. cert-manager must already be installed in the cluster;
## set this to false only if you're providing certificates another way
## (or don't need webhooks/secure metrics at all).
##
certManager:
  enabled: true

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Extra labels merged onto the ServiceMonitor/PrometheusRule this chart
  ## creates. kube-prometheus-stack's Prometheus/Alertmanager CRs default
  ## their serviceMonitorSelector/ruleSelector to matchLabels:
  ## {release: <kube-prometheus-stack's own release name>} -- without that
  ## label here, prometheus.enabled: true alone silently scrapes nothing.
  ## Example if kube-prometheus-stack was installed as release "monitoring":
  ##   additionalLabels:
  ##     release: monitoring
  ##
  additionalLabels: {}

  ## A curated set of 8 PrometheusRule alerts covering storage reconcile
  ## failures/latency, stuck finalizers, access-denied errors, bucket
  ## ownership adoption (audit), Application readiness, and reconcile
  ## concurrency/queue saturation. Deliberately its own flag, separate from
  ## prometheus.enabled above: turning on metrics scraping is harmless,
  ## turning on a set of alerts that can page someone is a decision worth
  ## making explicitly. Requires prometheus.enabled: true (the ServiceMonitor)
  ## for these metrics to actually be scraped in the first place.
  ##
  rules:
    enabled: false

## A Grafana dashboard covering the same ground as the PrometheusRule alerts
## above (application readiness, storage reconcile/finalizer health,
## Kubernetes API errors, reconcile saturation), shipped as a ConfigMap
## labeled grafana_dashboard: "1". kube-prometheus-stack's Grafana runs a
## sidecar that auto-discovers dashboards carrying that label -- by default
## it watches every namespace (NAMESPACE=ALL), so this needs no extra wiring
## on a standard kube-prometheus-stack install. If your Grafana's sidecar is
## scoped to specific namespaces instead, add this chart's release namespace
## to it. Requires prometheus.enabled: true for the underlying metrics to
## exist at all.
##
grafana:
  dashboard:
    enabled: false

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

