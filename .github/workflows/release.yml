name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

env:
  IMAGE: ghcr.io/ningendo7/forge-operator

jobs:
  # Gate the actual publish job below on every check that would normally run
  # on a push, so a tag can never publish on a red commit. These previously
  # ran unconditionally in parallel with `release`, with no dependency
  # between them; calling them as reusable workflows here means each one
  # runs a single time (their own `push` trigger is now branches-only, not
  # tags) and its result actually gates the release.
  # A reusable workflow's jobs can only be granted permissions that are a
  # subset of what the calling job itself holds. release.yml's top-level
  # `permissions: {}` means these calling jobs inherit "none" unless given
  # their own block — so each needs to explicitly hold at least what the
  # called workflow's own job requests (contents: read, in all five cases)
  # for that permission to actually flow through.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
  test-e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/test-e2e.yml
  test-chart:
    permissions:
      contents: read
    uses: ./.github/workflows/test-chart.yml

  release:
    needs: [test, lint, build, test-e2e, test-chart]
    permissions:
      contents: write
      packages: write
    name: Build, publish, and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Derive release versions
        id: version
        run: |
          # Container image tags keep the "v" prefix (Docker doesn't care).
          # Helm chart `version:` must be strict SemVer, so it's stripped here.
          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE }}:latest

      - name: Generate consolidated install manifest
        run: make build-installer IMG=${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Point the chart's default image at this release
        # Only patches the checked-out copy used to build the package below;
        # never committed back to the repo.
        run: |
          sed -i "s|repository: controller|repository: ${{ env.IMAGE }}|" charts/chart/values.yaml

      - name: Package Helm chart
        run: |
          # --version must be strict SemVer (Helm's own constraint on
          # Chart.yaml's version field), hence the stripped chart_version.
          # --app-version has no such constraint -- it's free-form, and the
          # manager Deployment template defaults its image tag to it when
          # manager.image.tag isn't explicitly set. It needs to match the
          # real image tag (image_tag, with the "v"), or that default
          # resolves to a tag that was never actually pushed.
          helm package charts/chart \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.image_tag }}" \
            --destination dist/

      - name: Push Helm chart to GHCR
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm push "dist/forge-operator-${{ steps.version.outputs.chart_version }}.tgz" "oci://${{ env.IMAGE }}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/forge-operator-${{ steps.version.outputs.chart_version }}.tgz
