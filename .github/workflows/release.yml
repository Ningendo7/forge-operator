name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

env:
  IMAGE: ghcr.io/ningendo7/forge-operator

jobs:
  release:
    permissions:
      contents: write
      packages: write
    name: Build, publish, and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Derive release versions
        id: version
        run: |
          # Container image tags keep the "v" prefix (Docker doesn't care).
          # Helm chart `version:` must be strict SemVer, so it's stripped here.
          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE }}:latest

      - name: Generate consolidated install manifest
        run: make build-installer IMG=${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Point the chart's default image at this release
        # Only patches the checked-out copy used to build the package below;
        # never committed back to the repo.
        run: |
          sed -i "s|repository: controller|repository: ${{ env.IMAGE }}|" charts/chart/values.yaml

      - name: Package Helm chart
        run: |
          helm package charts/chart \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.chart_version }}" \
            --destination dist/

      - name: Push Helm chart to GHCR
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm push "dist/forge-operator-${{ steps.version.outputs.chart_version }}.tgz" "oci://${{ env.IMAGE }}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/forge-operator-${{ steps.version.outputs.chart_version }}.tgz
